# Rendered by mise dotfiles (template mode) from the theme_* vars in
# ~/.config/mise/config.toml. `mise vars device_type=server` switches the
# accent to the server colours; anything else uses the desktop ones.

format = """
${custom.ssh_indicator}\
[ ${custom.live-clock-icon} $time ](fg:theme_bg bg:theme_base)[](fg:theme_base bg:theme_fg)\
[ $directory ](bg:theme_fg)[](fg:theme_fg bg:theme_bg)\
[ ($git_branch ${custom.git_status_dirty}$git_status )](fg:theme_base bg:theme_bg)[](fg:theme_bg bg:none)\
$fill\
$package\
$docker$aws$kubernetes\
$nodejs$rust$golang$python$php$buf$c$cmake$elixir$java$kotlin$lua$ruby$zig\
$line_break[ $battery $character  ](fg:theme_base bg:theme_fg)[ ](fg:theme_fg bg:none)\
"""

right_format = """
$status( $cmd_duration)\
"""

command_timeout = 2000

# Colors: from the theme_* vars in ~/.config/mise/config.toml, which the atuin
# theme shares. The accent follows device_type ({{ vars.device_type }} here).
{%- set dt = "server" if vars.device_type == "server" else "desktop" %}

palette = "lachie"

[palettes.lachie]
black = "{{ vars.theme_black }}"
red = "{{ vars.theme_red }}"
green = "{{ vars.theme_green }}"
yellow = "{{ vars.theme_yellow }}"
blue = "{{ vars.theme_blue }}"
purple = "{{ vars.theme_purple }}"
cyan = "{{ vars.theme_cyan }}"
white = "{{ vars.theme_white }}"
bright-black = "{{ vars.theme_bright_black }}"
bright-red = "{{ vars.theme_bright_red }}"
bright-green = "{{ vars.theme_bright_green }}"
bright-yellow = "{{ vars.theme_bright_yellow }}"
bright-blue = "{{ vars.theme_bright_blue }}"
bright-purple = "{{ vars.theme_bright_purple }}"
bright-cyan = "{{ vars.theme_bright_cyan }}"
bright-white = "{{ vars.theme_bright_white }}"
theme_bg = "{{ vars.theme_bg }}"
theme_fg = "{{ vars.theme_fg }}"
theme_light = "{{ vars["theme_light_" ~ dt] }}"
theme_base = "{{ vars["theme_base_" ~ dt] }}"
theme_dark = "{{ vars["theme_dark_" ~ dt] }}"


# Prompt

[character]
format = "$symbol"
success_symbol = "[󰚩 ](bg:prev_bg fg:theme_base)"
error_symbol = "[󱚝 ](bg:prev_bg fg:red)"

[line_break]
disabled = false

[fill]
symbol = " "

# SSH Indicator

[custom.ssh_indicator]
command = 'uname -n'
description = "Shows when connected via SSH"
format = "[ $symbol $output ]($style)[](fg:#F0DD7D bg:theme_base)"
style = "fg:theme_bg bg:#F0DD7D"
when = '[ -n "$SSH_TTY" ]'
symbol = "󰣀"
shell = ["sh"]

# System Information

[cmd_duration]
format = "[⏱ $duration ]($style)"

[status]
disabled = false
pipestatus = true
format = "[$symbol$status]($style)"
symbol = "✘"
pipestatus_format = "\\[$pipestatus\\]($style)"

[directory]
read_only = " 󰌾"
truncation_length = 2
fish_style_pwd_dir_length = 1
use_logical_path = true
style = "fg:theme_base bg:theme_fg"
format = "[$path]($style)[$read_only]($style)"

[time]
disabled = false
style = "fg:prev_fg bg:prev_bg"
time_format = "%R"              # Hour:Minute Format
format = '[$time]($style)'

[custom.live-clock-icon]
command = 'echo "󱑖󱑋" | cut -c $(($(date +%H)%12+1))'
description = "Live updating clock icon, changes hourly. Icons can be customized to your liking."
when = true
style = "fg:prev_fg bg:prev_bg"
format = "[$output]($style)"

[battery]
display = [
  { discharging_symbol = "󰁺", style = "bg:prev_bg fg:red", threshold = 10 },
  { discharging_symbol = "󰁻", style = "bg:prev_bg fg:yellow", threshold = 20 },
  { discharging_symbol = "󰁼", style = "bg:prev_bg fg:yellow", threshold = 30 },
  { discharging_symbol = "󰁽", style = "bg:prev_bg fg:green", threshold = 40 },
  { discharging_symbol = "󰁾", style = "bg:prev_bg fg:green", threshold = 50 },
  { discharging_symbol = "󰁿", style = "bg:prev_bg fg:green", threshold = 60 },
  { discharging_symbol = "󰂀", style = "bg:prev_bg fg:green", threshold = 70 },
  { discharging_symbol = "󰂁", style = "bg:prev_bg fg:green", threshold = 80 },
  { discharging_symbol = "󰂂", style = "bg:prev_bg fg:green", threshold = 90 },
  { discharging_symbol = "󰁹", style = "bg:prev_bg fg:green", threshold = 100 },
]
full_symbol = "󱈑"
charging_symbol = "󰂄"
discharging_symbol = "󰁾"
unknown_symbol = "󰂑"
empty_symbol = "󰂃"
format = "[$symbol]($style)"

# Version Control

[git_branch]
symbol = ""
format = '$symbol $branch'
style = "fg:prev_fg bg:prev_bg"

[git_commit]
tag_symbol = " "
style = "fg:prev_fg bg:prev_bg"

[git_status]
format = "[$ahead_behind]($style)"
style = "fg:prev_fg bg:prev_bg"
stashed = "≡"
ahead = "${count}"
behind = "${count}"
diverged = "${behind_count}${ahead_count}"

[custom.git_status_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol = "•"
style = "fg:prev_fg bg:prev_bg"
format = "[$symbol]($style)"
shell = ["sh"]

[hg_branch]
symbol = ""

[fossil_branch]
symbol = ""
format = "\\[[$symbol$branch]($style)\\]"

# Languages

[nodejs]
symbol = ""
format = '[$symbol ($version)]($style) '

[rust]
symbol = ""
format = '[$symbol ($version)]($style) '

[golang]
symbol = ""
format = '[$symbol ($version)]($style) '

[package]
disabled = false
symbol = "󰏗"
display_private = true
format = '[$symbol ($version)]($style) '

[python]
symbol = ""
format = "[${symbol} ${pyenv_prefix}(${version})(@$virtualenv)]($style)"

[php]
symbol = ""
format = '[$symbol ($version)]($style)'

[buf]
symbol = ""
format = '[$symbol ($version)]($style)'

[c]
symbol = ""
format = '[$symbol ($version)]($style)'

[cmake]
symbol = ""
format = '[$symbol ($version)]($style)'

[elixir]
symbol = ""
format = '[$symbol ($version)]($style)'

[java]
symbol = ""
format = '[$symbol ($version)]($style)'

[kotlin]
symbol = ""
format = '[$symbol ($version)]($style)'

[lua]
symbol = ""
format = '[$symbol ($version)]($style)'

[ruby]
symbol = ""
format = '[$symbol ($version)]($style)'

[zig]
symbol = ""
format = '[$symbol ($version)]($style)'

# Context

[aws]
disabled = false
symbol = ""
format = "[($symbol ($profile)@$region)(|$duration)]($style) "

[docker_context]
symbol = ""
disabled = false

[kubernetes]
disabled = true
symbol = ""
format = "[($symbol $context(|$namespace))]($style) "
